name: checks

# Twardy gate (nie do ominiecia jak lokalny hook): te same bramki co pre-commit.
on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret guard (wszystkie sledzone pliki)
        run: bash scripts/secret-guard.sh

      - name: Trivial-assert guard (tests/)
        run: bash scripts/check-trivial-asserts.sh tests
