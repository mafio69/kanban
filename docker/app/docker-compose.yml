# Aplikacja — osobny compose (nginx + php-fpm). Postgres w osobnym compose.
# Wymaga wspolnej sieci: docker network create kanban_net
services:
  php-fpm:
    build: ./php-fpm
    container_name: kanban_php
    env_file: ../../.env
    environment:
      - LOG_DIR=/var/log/app
    volumes:
      - ../../:/var/www/html
      - app_logs:/var/log/app
    networks:
      - kanban_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: kanban_nginx
    depends_on:
      - php-fpm
    ports:
      - "8090:80"
    volumes:
      - ../../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kanban_net
    restart: unless-stopped

volumes:
  app_logs:

networks:
  kanban_net:
    external: true
